name: UI Rebuild Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate routes
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit --noUncheckedIndexedAccess false --noPropertyAccessFromIndexSignature false
